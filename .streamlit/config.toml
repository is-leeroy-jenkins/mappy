[theme]
base = "dark"
primaryColor = "#8AA6B6"
backgroundColor = "#050A0F"
secondaryBackgroundColor = "#091119"
textColor = "#D6DDE2"
linkColor = "#9DB4C2"
linkUnderline = false
codeTextColor = "#C8D3DA"
