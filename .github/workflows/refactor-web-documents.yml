name: Refactor web document processing

on:
  push:
    branches:
      - feature/document-processing
    paths:
      - .github/workflows/refactor-web-documents.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-processing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply targeted refactor
        run: python .github/refactor_web_documents.py

      - name: Normalize whitespace on changed lines
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          result = subprocess.run(
              [ 'git', 'diff', '--check' ],
              capture_output=True,
              text=True,
              check=False,
          )
          targets = { }
          for line in result.stdout.splitlines( ):
              match = re.match( r'^(.+?):(\d+): trailing whitespace\.$', line )
              if match:
                  targets.setdefault( match.group( 1 ), set( ) ).add( int( match.group( 2 ) ) )

          for filename, line_numbers in targets.items( ):
              path = Path( filename )
              lines = path.read_text( encoding='utf-8' ).splitlines( keepends=True )
              for line_number in line_numbers:
                  index = line_number - 1
                  newline = '\n' if lines[ index ].endswith( '\n' ) else ''
                  lines[ index ] = lines[ index ].rstrip( '\r\n' ).rstrip( ' \t' ) + newline
              path.write_text( ''.join( lines ), encoding='utf-8' )
          PY

      - name: Validate syntax
        run: python -m py_compile app.py fetchers.py embedders.py stores/vector.py

      - name: Validate integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          fetchers = Path('fetchers.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')

          ast.parse(fetchers)
          ast.parse(app)

          required_fetchers = [
              'UnstructuredURLLoader',
              '-> List[ Document ]',
              "mode='single'",
              'loader.load( )',
          ]
          for token in required_fetchers:
              if token not in fetchers:
                  raise RuntimeError(f'Missing fetchers integration token: {token}')

          required_app = [
              'RecursiveCharacterTextSplitter',
              'EmbeddingFactory',
              'ChromaStore, PineconeStore',
              "st.slider(\n\t\t\t\t\t'Chunk Size'",
              "st.slider(\n\t\t\t\t\t'Chunk Overlap'",
              "'📄 Document'",
              "'✂️ Chunks'",
              "'🧠 Embeddings'",
          ]
          for token in required_app:
              if token not in app:
                  raise RuntimeError(f'Missing app integration token: {token}')

          if "crawler = WebCrawler" in app[app.index("elif mode == 'Web Scraper':"):app.index('# WEATHER MODE')]:
              raise RuntimeError('Legacy WebCrawler execution remains in Web Scraper mode.')
          PY

      - name: Check diff
        run: git diff --check

      - name: Remove temporary refactor files
        run: |
          rm .github/refactor_web_documents.py
          rm .github/workflows/refactor-web-documents.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate URL documents with chunking embeddings and vector storage"
          git push origin HEAD:feature/document-processing
