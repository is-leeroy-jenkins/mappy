name: Foo Layout Integration

on:
  push:
    branches:
      - fix/foo-document-layout

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foo-document-layout
      - name: Patch app integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'from document_processing import render_document_processing\n'
          new_import = 'from document_processing import render_document_processing, render_web_document_processing\n'
          if source.count(old_import) != 1:
              raise RuntimeError('Expected one document-processing import.')
          source = source.replace(old_import, new_import, 1)

          web_start = "# ==============================================================================\n# SCRAPING MODE\n# ==============================================================================\nelif mode == 'Web Scraper':\n"
          web_end = "# ==============================================================================\n# WEATHER MODE\n# ==============================================================================\n"
          if source.count(web_start) != 1 or source.count(web_end) != 1:
              raise RuntimeError('Web Scraper anchors not found exactly once.')
          start = source.index(web_start)
          end = source.index(web_end, start)
          source = source[:start] + web_start + "\trender_web_document_processing()\n\n" + source[end:]

          upload_start = "# ==============================================================================\n# DATA UPLOAD MODE\n# ==============================================================================\nelif mode == 'Data Upload':\n"
          upload_end = "# ==============================================================================\n# DATA MANAGEMENT MODE\n# ==============================================================================\n"
          if source.count(upload_start) != 1 or source.count(upload_end) != 1:
              raise RuntimeError('Data Upload anchors not found exactly once.')
          start = source.index(upload_start)
          end = source.index(upload_end, start)
          source = source[:start] + upload_start + "\trender_document_processing( cache )\n\n" + source[end:]

          path.write_text(source, encoding='utf-8', newline='')

      - name: Validate integration
        shell: bash
        run: |
          python -m py_compile app.py document_processing.py loaders.py embedders.py stores/vector.py
          git diff --check
          grep -q "render_web_document_processing()" app.py
          grep -q "render_document_processing( cache )" app.py
          grep -q "label='Local Documents'" document_processing.py
          grep -q "'📄 Loaded'" document_processing.py
          grep -q "'🌐 Scraped'" document_processing.py

      - name: Commit integration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/foo-layout-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/foo-layout-integration.yml
          git commit -m "Integrate Foo-style document layouts"
          git push origin HEAD:fix/foo-document-layout
