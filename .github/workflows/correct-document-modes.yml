name: Correct Document Modes

on:
  push:
    branches:
      - fix/api-mode-document-processing

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-mode-document-processing
          fetch-depth: 0
      - name: Apply correction
        run: |
          sed -i "s/('Environmental', 'Geological'/('Environmental', 'Astronomical'/" .github/correct_document_modes.py
          sed -i "s/('Geological', 'Astronomical'/('Geological', 'Generative'/" .github/correct_document_modes.py
          python .github/correct_document_modes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("elif mode == 'Data Upload':")
          end = source.index("elif mode == 'Data Management':", start)
          block = source[start:end]
          block = '\n'.join(line.rstrip() for line in block.split('\n'))
          path.write_text(source[:start] + block + source[end:], encoding='utf-8', newline='')
          PY
      - name: Validate
        run: |
          python -m py_compile app.py document_processing.py loaders.py embedders.py stores/vector.py
          git diff --check
          grep -q "render_web_document_processing( )" app.py
          grep -q "render_mode_processing_controls( 'weather'" app.py
          grep -q "render_mode_processing_controls( 'env'" app.py
          grep -q "render_mode_processing_controls( 'geo'" app.py
          grep -q "render_mode_processing_controls( 'astro'" app.py
          grep -q "render_mode_document_tabs( 'weather'" app.py
          grep -q "render_mode_document_tabs( 'env'" app.py
          grep -q "render_mode_document_tabs( 'geo'" app.py
          grep -q "render_mode_document_tabs( 'astro'" app.py
          if grep -A5 "elif mode == 'Data Upload':" app.py | grep -q 'render_document_processing'; then exit 1; fi
      - name: Commit correction
        run: |
          rm .github/correct_document_modes.py .github/workflows/correct-document-modes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py document_processing.py .github/correct_document_modes.py .github/workflows/correct-document-modes.yml
          git commit -m "Apply Foo processing to API modes"
          git push origin HEAD:fix/api-mode-document-processing
