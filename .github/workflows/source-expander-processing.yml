name: Source Expander Processing

on:
  push:
    branches: [ fix/source-expander-processing ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-expander-processing
          fetch-depth: 0

      - name: Apply source expander processing patch
        run: python .github/source_processing_patch.py

      - name: Validate
        shell: bash
        run: |
          python -m py_compile app.py document_processing.py loaders.py embedders.py stores/vector.py
          git diff --check
          grep -q "render_source_processing_controls( 'weather'" app.py
          grep -q "render_source_processing_controls( 'env'" app.py
          grep -q "render_source_processing_controls( 'geo'" app.py
          grep -q "render_source_processing_controls( 'astro'" app.py
          ! grep -q "render_mode_processing_controls(" app.py
          grep -q "label='Web Processing'" document_processing.py
          ! grep -q "label='Chunking'" document_processing.py
          ! grep -q "label='Embeddings'" document_processing.py
          ! grep -q "label='Vector Storage'" document_processing.py

      - name: Commit
        shell: bash
        run: |
          rm .github/source_processing_patch.py
          rm .github/workflows/source-expander-processing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py document_processing.py .github/source_processing_patch.py .github/workflows/source-expander-processing.yml
          git commit -m "Place processing controls inside source expanders"
          git push origin HEAD:fix/source-expander-processing
